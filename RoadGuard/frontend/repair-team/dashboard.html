<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Dashboard - RoadGuard AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="dash-wrap">
    <div id="sidebar"></div>
    <div class="dash-main">
      <div class="dash-topbar">
        <button class="btn btn-sm btn-light d-lg-none" onclick="document.getElementById('rgSidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
        <h5 id="pageTitle">Team Dashboard</h5>
        <div class="d-flex align-items-center gap-3">
          <a href="/notifications.html" class="text-muted"><i class="bi bi-bell fs-5"></i></a>
          <span class="badge bg-primary" id="topbarUser"></span>
        </div>
      </div>
      <div class="dash-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div>
            <h5 class="mb-0 fw-bold">Welcome, <span id="teamName">-</span></h5>
            <div class="text-muted-sm">Your assigned repairs and progress</div>
          </div>
          <button class="btn btn-outline-primary btn-sm" onclick="load()"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
        </div>

        <div class="row g-3" id="statCards"></div>

        <div class="card border-0 shadow-sm mt-4">
          <div class="card-header bg-white fw-bold">Recent Assignments</div>
          <div class="table-responsive">
            <table class="table rg-table align-middle mb-0">
              <thead><tr><th>Pothole</th><th>Road</th><th>Ward</th><th>Severity</th><th>Status</th><th>Deadline</th><th>Action</th></tr></thead>
              <tbody id="repairBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    if (!AUTH.requireAuth(["REPAIR_TEAM"])) throw new Error();
    COMPONENTS.demoBanner();
    COMPONENTS.sidebar([
      { key: "dashboard", href: "dashboard.html", icon: "bi-speedometer2", label: "Dashboard" },
      { key: "assignments", href: "assignments.html", icon: "bi-clipboard-check", label: "Assignments" },
    ], "dashboard");

    document.getElementById("teamName").textContent = AUTH.getUser().name;

    async function load() {
      try {
        const rows = await API.get("/repairs");
        const assigned = rows.filter((r) => r.status === "ASSIGNED" || r.status === "SCHEDULED");
        const inProgress = rows.filter((r) => r.status === "IN_PROGRESS");
        const done = rows.filter((r) => ["COMPLETED", "CITIZEN_VERIFICATION", "CLOSED"].includes(r.status));
        const est = rows.reduce((s, r) => s + (r.estimated_cost || 0), 0);
        const act = rows.reduce((s, r) => s + (r.actual_cost || 0), 0);

        document.getElementById("statCards").innerHTML = `
          <div class="col-6 col-xl-3"><div class="stat-card"><div class="icon icon-amber"><i class="bi bi-inbox"></i></div>
            <div><div class="stat-label">Awaiting Acceptance</div><div class="stat-value num">${assigned.length}</div></div></div></div>
          <div class="col-6 col-xl-3"><div class="stat-card"><div class="icon icon-blue"><i class="bi bi-tools"></i></div>
            <div><div class="stat-label">In Progress</div><div class="stat-value num">${inProgress.length}</div></div></div></div>
          <div class="col-6 col-xl-3"><div class="stat-card"><div class="icon icon-green"><i class="bi bi-check-circle"></i></div>
            <div><div class="stat-label">Completed</div><div class="stat-value num">${done.length}</div></div></div></div>
          <div class="col-6 col-xl-3"><div class="stat-card"><div class="icon icon-purple"><i class="bi bi-coin"></i></div>
            <div><div class="stat-label">Est. vs Actual</div><div class="stat-value num">${UTILS.fmtINR(est)} / ${UTILS.fmtINR(act)}</div></div></div></div>`;

        const body = document.getElementById("repairBody");
        if (!rows.length) { UTILS.emptyState("repairBody", "No assignments yet", "When government assigns a pothole, it appears here."); return; }
        body.innerHTML = rows.slice(0, 10).map((r) => {
          const p = r.pothole || {};
          const action = r.status === "ASSIGNED" || r.status === "SCHEDULED"
            ? `<button class="btn btn-sm btn-brand" data-act="accept" data-id="${r.id}">Accept</button>`
            : r.status === "IN_PROGRESS"
              ? `<a class="btn btn-sm btn-outline-primary" href="assignments.html">Update</a>`
              : `<span class="text-muted-sm">${UTILS.statusBadge(r.status)}</span>`;
          return `<tr>
            <td class="fw-bold">${UTILS.esc(p.pothole_code || "-")}</td>
            <td>${UTILS.esc(p.road || "-")}</td>
            <td>Ward ${UTILS.esc(p.ward || "-")}</td>
            <td>${UTILS.severityBadge(p.severity)}</td>
            <td>${UTILS.statusBadge(r.status)}</td>
            <td class="text-muted-sm">${UTILS.fmtDate(r.deadline)}</td>
            <td>${action}</td>
          </tr>`;
        }).join("");
        body.querySelectorAll("[data-act=accept]").forEach((btn) => btn.addEventListener("click", async () => {
          try { await API.post(`/repairs/${btn.dataset.id}/accept`); UTILS.toast("Assignment accepted."); load(); }
          catch (e) { UTILS.toast(e.message, "danger"); }
        }));
      } catch (e) { UTILS.errorState("repairBody", e.message); }
    }

    load();
  </script>
</body>
</html>
