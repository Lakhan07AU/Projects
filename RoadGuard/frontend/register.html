<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - RoadGuard AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/forms.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus-fill fs-1 text-primary"></i>
        <h4 class="mt-2 mb-0">Create your account</h4>
        <p class="text-muted-sm mb-0">Join RoadGuard AI as a citizen</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="name">Full name</label>
          <input type="text" class="form-control" id="name" placeholder="Your name" required minlength="2">
          <div class="invalid-feedback">Please enter your name (at least 2 characters).</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="phone">Phone (optional)</label>
          <input type="tel" class="form-control" id="phone" placeholder="+91 98765 43210" pattern="[0-9+ ]{8,15}">
          <div class="invalid-feedback">Enter a valid phone number.</div>
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Min 8 characters" required minlength="8">
            <div class="invalid-feedback">At least 8 characters.</div>
          </div>
          <div class="col-6">
            <label class="form-label" for="confirm">Confirm password</label>
            <input type="password" class="form-control" id="confirm" placeholder="Repeat password" required>
            <div class="invalid-feedback" id="confirmFeedback">Passwords must match.</div>
          </div>
        </div>
        <button class="btn btn-brand w-100 py-2 mt-3" id="registerBtn" type="submit">Create Account</button>
      </form>

      <p class="text-center mt-3 mb-0 text-muted-sm">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    AUTH.redirectIfLoggedIn();

    document.getElementById("registerForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const form = ev.target;
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const confirmInput = document.getElementById("confirm");

      if (password !== confirm) {
        confirmInput.classList.add("is-invalid");
        form.classList.add("was-validated");
        return;
      }
      confirmInput.classList.remove("is-invalid");

      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const btn = document.getElementById("registerBtn");
      UTILS.spinnerButton(btn, true, "Creating account...");
      try {
        await AUTH.register({
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim() || null,
          password: password,
        });
        UTILS.toast("Account created. Welcome to RoadGuard AI!");
        setTimeout(() => { window.location.href = AUTH.homeFor(AUTH.getUser().role); }, 800);
      } catch (e) {
        UTILS.toast(e.message, "danger");
        UTILS.spinnerButton(btn, false);
      }
    });
  </script>
</body>
</html>
