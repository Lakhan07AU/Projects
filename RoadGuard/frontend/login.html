<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - RoadGuard AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/forms.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-shield-fill-check fs-1 text-primary"></i>
        <h4 class="mt-2 mb-0">Welcome back</h4>
        <p class="text-muted-sm mb-0">Sign in to RoadGuard AI</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required autocomplete="email">
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Your password" required autocomplete="current-password">
          <div class="invalid-feedback">Password is required.</div>
        </div>
        <button class="btn btn-brand w-100 py-2" id="loginBtn" type="submit">Login</button>
      </form>

      <p class="text-center mt-3 mb-0 text-muted-sm">
        No account? <a href="register.html">Create one</a> &middot; <a href="index.html">Home</a>
      </p>

      <div class="demo-login-box">
        <div class="text-muted-sm fw-bold mb-2"><i class="bi bi-lightning-charge-fill me-1"></i>Demo accounts (password: <code>demo1234</code>)</div>
        <div class="d-grid gap-2">
          <button class="btn btn-outline-primary btn-sm" onclick="demoLogin('citizen@roadguard.demo')">Citizen</button>
          <button class="btn btn-outline-primary btn-sm" onclick="demoLogin('official@roadguard.demo')">Government Official</button>
          <button class="btn btn-outline-primary btn-sm" onclick="demoLogin('admin@roadguard.demo')">Administrator</button>
          <button class="btn btn-outline-primary btn-sm" onclick="demoLogin('team@roadguard.demo')">Repair Team</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    AUTH.redirectIfLoggedIn();

    async function demoLogin(email) {
      try {
        await AUTH.login(email, "demo1234");
        window.location.href = AUTH.homeFor(AUTH.getUser().role);
      } catch (e) { UTILS.toast(e.message, "danger"); }
    }

    document.getElementById("loginForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const form = ev.target;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!form.checkValidity() || !password) {
        form.classList.add("was-validated");
        return;
      }
      const btn = document.getElementById("loginBtn");
      UTILS.spinnerButton(btn, true, "Signing in...");
      try {
        await AUTH.login(email, password);
        window.location.href = AUTH.homeFor(AUTH.getUser().role);
      } catch (e) {
        UTILS.toast(e.message, "danger");
        UTILS.spinnerButton(btn, false);
      }
    });
  </script>
</body>
</html>
