<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - RoadGuard AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-5" style="max-width:860px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0"><i class="bi bi-bell me-2 text-primary"></i>Notifications <span class="badge bg-danger" id="unreadBadge" style="display:none;">0</span></h4>
      <button class="btn btn-outline-secondary btn-sm" id="readAllBtn"><i class="bi bi-check2-all me-1"></i>Mark all read</button>
    </div>
    <div id="notifList"></div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script>
    AUTH.requireAuth();
    COMPONENTS.publicNavbar("notifications");
    COMPONENTS.footer();

    const ICONS = { SYSTEM: "bi-gear", COMPLAINT: "bi-clipboard2-pulse", REPAIR: "bi-tools", CRITICAL: "bi-exclamation-triangle", DEADLINE: "bi-hourglass-split" };

    async function load() {
      UTILS.showLoading("notifList");
      try {
        const data = await API.get("/notifications");
        const badge = document.getElementById("unreadBadge");
        badge.style.display = data.unread ? "" : "none";
        badge.textContent = data.unread;
        const el = document.getElementById("notifList");
        if (!data.items.length) {
          UTILS.emptyState("notifList", "No notifications", "You're all caught up.");
          return;
        }
        el.innerHTML = data.items.map((n) => `
          <div class="card border-0 shadow-sm mb-2 ${n.is_read ? "notif-read" : ""}">
            <div class="card-body d-flex align-items-start gap-3">
              <i class="bi ${ICONS[n.type] || ICONS.SYSTEM} fs-4 text-primary mt-1"></i>
              <div class="flex-grow-1">
                <div class="d-flex justify-content-between">
                  <strong>${UTILS.esc(n.title)}</strong>
                  <span class="text-muted-sm">${UTILS.fmtDate(n.created_at)}</span>
                </div>
                <div class="small text-muted">${UTILS.esc(n.message)}</div>
              </div>
              ${n.is_read ? "" : `<button class="btn btn-sm btn-light notif-read-btn" data-id="${n.id}">Mark read</button>`}
            </div>
          </div>`).join("");

        el.querySelectorAll(".notif-read-btn").forEach((b) => b.addEventListener("click", async () => {
          await API.post(`/notifications/${b.dataset.id}/read`);
          load();
        }));
      } catch (e) { UTILS.errorState("notifList", e.message); }
    }

    document.getElementById("readAllBtn").addEventListener("click", async () => {
      try { await API.post("/notifications/read-all"); load(); } catch (e) { UTILS.toast(e.message, "danger"); }
    });

    load();
  </script>
</body>
</html>
