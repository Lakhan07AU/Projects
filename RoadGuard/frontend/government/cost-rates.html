<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cost Rates - RoadGuard AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="dash-wrap">
    <div id="sidebar"></div>
    <div class="dash-main">
      <div class="dash-topbar">
        <button class="btn btn-sm btn-light d-lg-none" onclick="document.getElementById('rgSidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
        <h5 id="pageTitle">Cost Rates</h5>
        <div class="d-flex align-items-center gap-3">
          <a href="/notifications.html" class="text-muted"><i class="bi bi-bell fs-5"></i></a>
          <span class="badge bg-primary" id="topbarUser"></span>
        </div>
      </div>
      <div class="dash-content">
        <div class="alert alert-warning small">
          <i class="bi bi-info-circle me-1"></i>These rates drive the deterministic, AI-assisted preliminary cost estimates. Changes affect future estimates only. Only administrators can edit rates.
        </div>
        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table rg-table align-middle mb-0">
              <thead><tr><th>Key</th><th>Name</th><th>Value</th><th>Unit</th><th>Previous</th><th>Updated by</th><th>Effective</th><th class="text-end" style="width:120px;">Action</th></tr></thead>
              <tbody id="ratesBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal fade" id="rateModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Edit Cost Rate</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p class="small text-muted" id="rateTarget"></p>
        <label class="form-label" for="rateValue">New value</label>
        <input type="number" class="form-control" id="rateValue" step="any">
      </div>
      <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand" id="saveRateBtn">Save</button></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    if (!AUTH.requireAuth(["GOVERNMENT_OFFICIAL", "ADMIN"])) throw new Error();
    COMPONENTS.demoBanner();
    COMPONENTS.sidebar([
      { key: "dashboard", href: "dashboard.html", icon: "bi-speedometer2", label: "Dashboard" },
      { key: "potholes", href: "potholes.html", icon: "bi-exclamation-diamond", label: "Potholes" },
      { key: "repairs", href: "repairs.html", icon: "bi-tools", label: "Repairs" },
      { key: "analytics", href: "analytics.html", icon: "bi-bar-chart", label: "Analytics" },
      { key: "costrates", href: "cost-rates.html", icon: "bi-cash-coin", label: "Cost Rates" },
      { key: "users", href: "users.html", icon: "bi-people", label: "Users" },
    ], "costrates");

    const isAdmin = AUTH.getUser().role === "ADMIN";
    let currentRate = null;

    async function load() {
      UTILS.showLoading("ratesBody");
      try {
        const rows = await API.get("/cost-rates");
        document.getElementById("ratesBody").innerHTML = rows.map((r) => `
          <tr>
            <td class="fw-bold">${UTILS.esc(r.rate_key)}</td>
            <td>${UTILS.esc(r.name)}</td>
            <td class="num fw-bold">${UTILS.fmtNum(r.value, 2)}</td>
            <td>${UTILS.esc(r.unit)}</td>
            <td class="text-muted-sm">${r.previous_value != null ? UTILS.fmtNum(r.previous_value, 2) : "-"}</td>
            <td>${UTILS.esc(r.updated_by || "-")}</td>
            <td class="text-muted-sm">${UTILS.fmtDate(r.effective_date)}</td>
            <td class="text-end">${isAdmin ? `<button class="btn btn-sm btn-outline-primary" data-id="${r.id}" data-key="${UTILS.esc(r.rate_key)}" data-value="${r.value}">Edit</button>` : "-"}</td>
          </tr>`).join("");
        document.querySelectorAll("[data-id]").forEach((btn) => btn.addEventListener("click", () => {
          currentRate = btn.dataset.id;
          document.getElementById("rateTarget").textContent = btn.dataset.key + " (current: " + UTILS.fmtNum(btn.dataset.value, 2) + ")";
          document.getElementById("rateValue").value = btn.dataset.value;
          new bootstrap.Modal(document.getElementById("rateModal")).show();
        }));
      } catch (e) { UTILS.errorState("ratesBody", e.message); }
    }

    document.getElementById("saveRateBtn").addEventListener("click", async () => {
      const val = parseFloat(document.getElementById("rateValue").value);
      if (isNaN(val)) { UTILS.toast("Enter a valid number.", "warning"); return; }
      try {
        await API.patch(`/cost-rates/${currentRate}`, { value: val });
        UTILS.toast("Rate updated.");
        bootstrap.Modal.getInstance(document.getElementById("rateModal")).hide();
        load();
      } catch (e) { UTILS.toast(e.message, "danger"); }
    });

    load();
  </script>
</body>
</html>
