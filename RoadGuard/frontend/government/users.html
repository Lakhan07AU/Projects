<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users - RoadGuard AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="dash-wrap">
    <div id="sidebar"></div>
    <div class="dash-main">
      <div class="dash-topbar">
        <button class="btn btn-sm btn-light d-lg-none" onclick="document.getElementById('rgSidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
        <h5 id="pageTitle">Users</h5>
        <div class="d-flex align-items-center gap-3">
          <a href="/notifications.html" class="text-muted"><i class="bi bi-bell fs-5"></i></a>
          <span class="badge bg-primary" id="topbarUser"></span>
        </div>
      </div>
      <div class="dash-content">
        <div class="alert alert-warning small">
          <i class="bi bi-info-circle me-1"></i>Citizen contact details are sensitive. Do not share them publicly.
        </div>
        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table rg-table align-middle mb-0">
              <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Joined</th></tr></thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    if (!AUTH.requireAuth(["ADMIN"])) throw new Error();
    COMPONENTS.demoBanner();
    COMPONENTS.sidebar([
      { key: "dashboard", href: "dashboard.html", icon: "bi-speedometer2", label: "Dashboard" },
      { key: "potholes", href: "potholes.html", icon: "bi-exclamation-diamond", label: "Potholes" },
      { key: "repairs", href: "repairs.html", icon: "bi-tools", label: "Repairs" },
      { key: "analytics", href: "analytics.html", icon: "bi-bar-chart", label: "Analytics" },
      { key: "costrates", href: "cost-rates.html", icon: "bi-cash-coin", label: "Cost Rates" },
      { key: "users", href: "users.html", icon: "bi-people", label: "Users" },
    ], "users");

    async function load() {
      UTILS.showLoading("usersBody");
      try {
        const rows = await API.get("/users");
        document.getElementById("usersBody").innerHTML = rows.map((u) => `
          <tr>
            <td class="fw-bold">${UTILS.esc(u.name)}</td>
            <td>${UTILS.esc(u.email)}</td>
            <td class="text-muted-sm">${UTILS.esc(u.phone || "-")}</td>
            <td><span class="badge bg-light text-dark">${UTILS.esc(AUTH.ROLE_LABELS[u.role] || u.role)}</span></td>
            <td>${u.is_active ? '<span class="badge bg-success-subtle text-success">Active</span>' : '<span class="badge bg-danger-subtle text-danger">Inactive</span>'}</td>
            <td class="text-muted-sm">${UTILS.fmtDate(u.created_at)}</td>
          </tr>`).join("");
      } catch (e) { UTILS.errorState("usersBody", e.message); }
    }

    load();
  </script>
</body>
</html>
