<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics - RoadGuard AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="dash-wrap">
    <div id="sidebar"></div>
    <div class="dash-main">
      <div class="dash-topbar">
        <button class="btn btn-sm btn-light d-lg-none" onclick="document.getElementById('rgSidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
        <h5 id="pageTitle">Analytics</h5>
        <div class="d-flex align-items-center gap-3">
          <a href="/notifications.html" class="text-muted"><i class="bi bi-bell fs-5"></i></a>
          <span class="badge bg-primary" id="topbarUser"></span>
        </div>
      </div>
      <div class="dash-content">
        <div class="row g-3">
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm"><div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-coin me-2 text-primary"></i>Estimated vs Actual</h6>
              <canvas id="costChart" height="140"></canvas>
            </div></div>
          </div>
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm"><div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-flag me-2 text-primary"></i>Pending vs Completed</h6>
              <canvas id="doneChart" height="140"></canvas>
            </div></div>
          </div>
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm"><div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-clock me-2 text-primary"></i>Avg Repair Time</h6>
              <div class="display-4 fw-bold text-primary num" id="avgTime">-</div>
              <div class="text-muted-sm">days from assignment to completion</div>
            </div></div>
          </div>

          <div class="col-lg-6">
            <div class="card border-0 shadow-sm"><div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-calendar-week me-2 text-primary"></i>Reports Over Time (30 days)</h6>
              <canvas id="timeChart" height="160"></canvas>
            </div></div>
          </div>
          <div class="col-lg-6">
            <div class="card border-0 shadow-sm"><div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-signpost-split me-2 text-primary"></i>Top Damaged Roads</h6>
              <div id="roadList"></div>
            </div></div>
          </div>

          <div class="col-lg-6">
            <div class="card border-0 shadow-sm"><div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-heart-pulse me-2 text-primary"></i>Road Health (worst first)</h6>
              <div id="healthList"></div>
            </div></div>
          </div>
          <div class="col-lg-6">
            <div class="card border-0 shadow-sm"><div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-chat-dots me-2 text-primary"></i>Analytics Assistant</h6>
              <p class="text-muted-sm">Ask questions about potholes, wards, budget and priorities.</p>
              <div class="chat-box" id="chatBox"></div>
              <div class="d-flex gap-2 mt-2">
                <input class="form-control" id="chatInput" placeholder="e.g. Which ward has the most critical potholes?">
                <button class="btn btn-brand px-3" id="chatSend">Send</button>
              </div>
            </div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    if (!AUTH.requireAuth(["GOVERNMENT_OFFICIAL", "ADMIN"])) throw new Error();
    COMPONENTS.demoBanner();
    COMPONENTS.sidebar([
      { key: "dashboard", href: "dashboard.html", icon: "bi-speedometer2", label: "Dashboard" },
      { key: "potholes", href: "potholes.html", icon: "bi-exclamation-diamond", label: "Potholes" },
      { key: "repairs", href: "repairs.html", icon: "bi-tools", label: "Repairs" },
      { key: "analytics", href: "analytics.html", icon: "bi-bar-chart", label: "Analytics" },
      { key: "costrates", href: "cost-rates.html", icon: "bi-cash-coin", label: "Cost Rates" },
      { key: "users", href: "users.html", icon: "bi-people", label: "Users" },
    ], "analytics");

    let charts = {};

    async function load() {
      try {
        const d = await API.get("/dashboard/analytics");
        document.getElementById("avgTime").textContent = d.avg_repair_time || 0;

        const cost = document.getElementById("costChart");
        if (charts.cost) charts.cost.destroy();
        charts.cost = new Chart(cost, { type: "bar", data: {
          labels: ["Estimated", "Actual"],
          datasets: [{ data: [d.estimated_vs_actual.estimated, d.estimated_vs_actual.actual], backgroundColor: ["#3b82f6", "#10b981"] }],
        }, options: { plugins: { legend: { display: false } } } });

        const done = document.getElementById("doneChart");
        if (charts.done) charts.done.destroy();
        charts.done = new Chart(done, { type: "doughnut", data: {
          labels: ["Pending/Open", "Completed"],
          datasets: [{ data: [d.pending_vs_completed.pending, d.pending_vs_completed.completed], backgroundColor: ["#f59e0b", "#22c55e"] }],
        }, options: { plugins: { legend: { position: "bottom" } } } });

        const time = document.getElementById("timeChart");
        if (charts.time) charts.time.destroy();
        charts.time = new Chart(time, { type: "line", data: {
          labels: d.reports_over_time.map((r) => UTILS.fmtDate(r.date)),
          datasets: [{
            label: "Reports", data: d.reports_over_time.map((r) => r.count),
            borderColor: "#3b82f6", fill: true, tension: .35,
          }],
        }, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });

        const roads = document.getElementById("roadList");
        roads.innerHTML = d.top_damaged_roads.length ? d.top_damaged_roads.map((r, i) => `
          <div class="d-flex justify-content-between py-1 border-bottom small">
            <span>${i + 1}. ${UTILS.esc(r.road)}</span><span class="badge bg-light text-dark">${r.count}</span>
          </div>`).join("") : UTILS.emptyState("roadList", "No data");

        const health = document.getElementById("healthList");
        health.innerHTML = d.road_health.length ? d.road_health.map((r) => {
          const cls = r.health_score < 40 ? "bg-danger" : r.health_score < 70 ? "bg-warning" : "bg-success";
          return `<div class="mb-2">
            <div class="d-flex justify-content-between small mb-1"><span>${UTILS.esc(r.road)}</span><strong>${r.health_score}/100</strong></div>
            <div class="progress" style="height:6px;"><div class="progress-bar ${cls}" style="width:${Math.min(100, r.health_score)}%"></div></div>
          </div>`;
        }).join("") : UTILS.emptyState("healthList", "No data");
      } catch (e) { UTILS.errorState("avgTime", e.message); }
    }

    // Assistant chat
    function addMsg(text, who) {
      const box = document.getElementById("chatBox");
      const div = document.createElement("div");
      div.className = "chat-msg " + (who === "user" ? "chat-user" : "chat-bot");
      if (who === "bot") {
        const pre = document.createElement("pre");
        pre.textContent = text;
        div.appendChild(pre);
      } else {
        div.textContent = text;
      }
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById("chatSend").addEventListener("click", async () => {
      const input = document.getElementById("chatInput");
      const q = input.value.trim();
      if (!q) return;
      addMsg(q, "user");
      input.value = "";
      addMsg("Thinking...", "bot");
      try {
        const res = await API.post("/ai/assistant", { question: q });
        const box = document.getElementById("chatBox");
        box.lastChild.textContent = res.answer || JSON.stringify(res, null, 2);
        box.lastChild.innerHTML = `<pre style="white-space:pre-wrap;margin:0;font-size:.85rem;">${UTILS.esc(res.answer || "")}</pre>`;
      } catch (e) {
        const box = document.getElementById("chatBox");
        box.lastChild.textContent = "Error: " + e.message;
      }
    });

    document.getElementById("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("chatSend").click(); });

    load();
  </script>
</body>
</html>
