name: healthsphere-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthsphere
      POSTGRES_PASSWORD: healthsphere_dev_only
      POSTGRES_DB: healthsphere
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthsphere"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  worker:
    build: ./apps/api
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      api:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
